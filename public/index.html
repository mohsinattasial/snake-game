<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake — Mohsin Atta</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c2152,#080d1d 70%);color:#f4f7ff;font:16px system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}main{width:min(100%,850px);text-align:center}h1{font-size:clamp(32px,6vw,56px);margin:5px 0}p{color:#aab6d6}.panel{background:#101b35;border:1px solid #34497c;border-radius:22px;padding:16px;box-shadow:0 16px 70px #0009}.stats{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:6px 8px 18px;font-weight:750}.stats span{color:#5affcb}canvas{display:block;width:100%;border-radius:12px;background:#0b1429;touch-action:none;aspect-ratio:24/15}button{font:inherit;color:white;cursor:pointer;padding:10px 18px;background:#244269;border:1px solid #416ca3;border-radius:12px}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.dpad{display:grid;grid-template-columns:repeat(3,52px);gap:5px;justify-content:center;margin-top:10px}.dpad button{padding:10px}.dpad .empty{visibility:hidden}a{color:#53f9cb}.hint{font-size:13px}
</style></head><body><main><h1>🐍 Neon Snake</h1><p>Browser edition of the original Pygame project</p><div class="panel"><div class="stats"><div>Score: <span id="score">0</span></div><div>Best: <span id="best">0</span></div><div id="status" role="status">Ready</div></div>
<canvas id="game" width="720" height="450" aria-label="Snake game board"></canvas><div class="buttons"><button id="start">Start / Restart</button><button id="pause">Pause / Resume</button></div><div class="dpad"><span class="empty"></span><button data-dir="up">↑</button><span class="empty"></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div>
<p class="hint">Arrow keys / WASD: move · P: pause · R: restart · Escape: pause. <a href="https://github.com/mohsinattasial/snake-game">View original Python code</a></p></div></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=24,H=15,S=30;
let snake,food,dir,next,score,playing=false,paused=false,over=false,timer=null,speed=125;
const $=id=>document.getElementById(id);let best=0;
function place(){let empty=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!snake.some(c=>c.x===x&&c.y===y))empty.push({x,y});if(!empty.length){end('You win!');return}food=empty[Math.floor(Math.random()*empty.length)]}
function reset(){clearInterval(timer);snake=[{x:8,y:7},{x:7,y:7},{x:6,y:7}];dir={x:1,y:0};next={...dir};score=0;speed=125;playing=true;paused=false;over=false;place();$('score').textContent=score;$('status').textContent='Playing';timer=setInterval(step,speed);draw()}
function end(msg){playing=false;over=true;clearInterval(timer);$('status').textContent=msg;draw()}
function pause(){if(!playing||over)return;paused=!paused;$('status').textContent=paused?'Paused':'Playing';draw()}
function change(d){const choices={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const v=choices[d];if(v&&(v.x!==-dir.x||v.y!==-dir.y))next=v}
function step(){if(!playing||paused)return;dir=next;let head={x:(snake[0].x+dir.x+W)%W,y:(snake[0].y+dir.y+H)%H};const eating=head.x===food.x&&head.y===food.y;const collide=snake.slice(0,eating?snake.length:snake.length-1).some(c=>c.x===head.x&&c.y===head.y);if(collide){end('Game over');return}
snake.unshift(head);if(eating){score+=10;best=Math.max(best,score);$('score').textContent=score;$('best').textContent=best;place();if(score%40===0){speed=Math.max(60,speed-7);clearInterval(timer);timer=setInterval(step,speed)}}else snake.pop();draw()}
function draw(){ctx.fillStyle='#0a1328';ctx.fillRect(0,0,720,450);ctx.strokeStyle='#152648';for(let i=0;i<=W;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,450);ctx.stroke()}for(let i=0;i<=H;i++){ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(720,i*S);ctx.stroke()}if(food){ctx.shadowBlur=24;ctx.shadowColor='#ff537c';ctx.fillStyle='#ff557a';ctx.beginPath();ctx.arc(food.x*S+15,food.y*S+15,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}snake?.forEach((c,i)=>{ctx.fillStyle=i===0?'#52ffd4':'#2ebf99';ctx.shadowBlur=i===0?16:0;ctx.shadowColor='#52ffd4';ctx.fillRect(c.x*S+2,c.y*S+2,S-4,S-4)});ctx.shadowBlur=0;if(!playing||paused){ctx.fillStyle='#030b19a8';ctx.fillRect(0,0,720,450);ctx.fillStyle='white';ctx.font='bold 36px system-ui';ctx.textAlign='center';ctx.fillText(over?'Game over':paused?'Paused':'Press Start',360,225)}}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();change(map[e.key])}if(e.key.toLowerCase()==='p'||e.key==='Escape')pause();if(e.key.toLowerCase()==='r')reset()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.dir)));$('start').addEventListener('click',reset);$('pause').addEventListener('click',pause);snake=[{x:8,y:7},{x:7,y:7},{x:6,y:7}];food={x:15,y:7};draw();
</script></body></html>
